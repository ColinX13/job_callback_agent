<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0f0f0f;
      color: #f5f5f5;
    }
    h2 { font-size: 16px; margin: 0 0 16px; }
    p { font-size: 13px; color: #888; margin: 0 0 16px; }
    .status {
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 12px;
    }
    .success { background: #052e16; color: #86efac; }
    .error { background: #450a0a; color: #fca5a5; }
    input[type="file"] { display: none; }
    label, button {
      display: block;
      width: 100%;
      padding: 10px;
      background: #6366f1;
      color: white;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      box-sizing: border-box;
      border: none;
    }
    label:hover, button:hover { background: #4f46e5; }
    hr {
      border: none;
      border-top: 1px solid #333;
      margin: 16px 0;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #f5f5f5;
      font-size: 12px;
      font-family: inherit;
      resize: vertical;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    textarea::placeholder { color: #555; }
    .section-label {
      font-size: 12px;
      color: #888;
      margin: 0 0 6px;
    }
  </style>
</head>
<body>
    <h2>Job Callback Agent</h2>
    <p>Upload your resume once and get instant job fit analysis on any Greenhouse, Lever, or Ashby posting.</p>

    <div id="resume-status"></div>

    <label for="resume-upload">
        📄 Upload Resume (PDF)
    </label>
    <input type="file" id="resume-upload" accept=".pdf,.txt">

    <hr>

    <p class="section-label">Auto-detect didn't work? Paste the job description below:</p>
    <textarea id="manual-jd" placeholder="Paste the full job description here..."></textarea>
    <button id="manual-analyze">Analyze Job Description</button>
    <div id="manual-status"></div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
</body>
</html>
